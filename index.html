<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lead Generator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h2>Upload Instagram Screenshots</h2>

  <input
    type="file"
    id="photos"
    accept="image/png,image/jpeg"
    multiple
  >

  <br>

  <button id="addButton" onclick="addPhotos()">
    Add Photos
  </button>

  <button id="submitButton" onclick="uploadPhotos()">
    Submit
  </button>

  <div id="fileList"></div>

  <p id="status"></p>

  <div id="loader" class="hidden">
    <div class="spinner"></div>
    <p>Processing your leads...</p>
    <small>This may take a moment.</small>
  </div>

  <div id="results"></div>

  <script src="script.js"></script>

</body>
</html>
