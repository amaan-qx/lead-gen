<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lead Generator</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h2>Instagram Leads</h2>

  <textarea
    id="leadText"
    placeholder="Paste Instagram usernames here..."
    rows="12"
  ></textarea>

  <br>

  <button id="submitButton" onclick="submitLeads()">
    Submit
  </button>

  <p id="status"></p>

  <div id="loader" class="hidden">
    <div class="spinner"></div>
    <p>Processing your leads...</p>
    <small>This may take a moment.</small>
  </div>

  <div id="results"></div>

  <script src="script.js"></script>

</body>
</html>
